<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mule Create – Introduction</title>
<style>
  :root { --bg: #1e1e1f; --panel: #262627; --line: #3a3a3d; --text: #e2dfda; --dim: #a9a5a0; --accent: #d08a5e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); }
  header p { margin: 0; color: var(--dim); font-size: 14px; max-width: 70ch; }
  nav { display: flex; gap: 8px; align-items: center; }
  button { background: var(--line); color: var(--text); border: 0; border-radius: 6px; padding: 8px 14px;
           font: inherit; cursor: pointer; }
  button:hover { background: var(--accent); color: #1e1e1f; }
  #count { color: var(--dim); min-width: 5ch; text-align: center; }
  main { padding: 16px; display: flex; justify-content: center; }
  .slide { display: none; max-width: 1600px; width: 100%; }
  .slide.on { display: block; }
  .slide img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<header>
  <div><h1>Mule Create – Introduction</h1><p>Any question about Mule: give the file AI_HANDBOOK.md to your AI (Claude, ChatGPT, Codex …) and ask it – it describes every function, shortcut and workflow.</p></div>
  <nav><button id="prev" aria-label="Previous">←</button><span id="count"></span>
  <button id="next" aria-label="Next">→</button></nav>
</header>
<main>
<section class="slide" data-n="1"><img src="handbook/01_overview.png" alt="The window: Mule has four modes: Draw puts lines down, Edit changes them, Notes holds prompts for the AI, Shots shows timing. Any question about Mule: give the file AI_HANDBOOK.md to your AI and ask it."></section>
<section class="slide" data-n="2"><img src="handbook/02_pen_brush.png" alt="Pen and brush – both draw lines: Pen and brush both draw lines you can edit and build surfaces from. The only difference is the look: the pen draws grey pencil, the brush draws in the current colour."></section>
<section class="slide" data-n="3"><img src="handbook/03_paint_mode.png" alt="Draw mode and Paint mode: In Draw mode pen and brush make lines – the construction. In Paint mode they lay colour flat onto the surface – for look and shading, never for the shape."></section>
<section class="slide" data-n="4"><img src="handbook/04_free_mode.png" alt="Free mode (Q) – drawing without a plane: Free mode draws in space without a plane: the stroke lies in an imagined plane through its start point, facing the camera. It must start on an existing line or surface; its end may dock somewhere else."></section>
<section class="slide" data-n="5"><img src="handbook/05_hold_shape.png" alt="Straight lines and shapes: hold still: Draw freely; if you hold still for a moment at the end of a stroke, Mule turns it into a straight line or a clean shape."></section>
<section class="slide" data-n="6"><img src="handbook/06_new_plane.png" alt="Own planes: Space+N: You always draw onto a plane or surface. Space+N creates a new plane exactly where the cursor points – for example at the handle of the cup – so you can draw details there."></section>
<section class="slide" data-n="7"><img src="handbook/07_draw_on_surface.png" alt="Drawing on surfaces: lines shape, paint colours: You can draw directly on surfaces and meshes. Lines drawn on a surface become its control lines and shape it; paint only colours it."></section>
<section class="slide" data-n="8"><img src="handbook/08_edit_gizmo.png" alt="Edit mode (Tab): select and transform: Tab switches to Edit mode. Select what you want to change, then T, R or E shows the gizmo to move, rotate or scale it."></section>
<section class="slide" data-n="9"><img src="handbook/09_extrude.png" alt="Extrude (X): Extruding pulls a copy of the selected lines away and builds walls between them – the quickest way from a drawn outline to a volume."></section>
<section class="slide" data-n="10"><img src="handbook/10_loft.png" alt="Loft (Shift+F): A loft is a curved surface through several cross-sections, like Skin in Houdini: draw the sections, select them in order, press Shift+F."></section>
<section class="slide" data-n="11"><img src="handbook/11_fill.png" alt="Surface from lines (F): Surfaces always come from lines: select lines that close an outline and press F."></section>
<section class="slide" data-n="12"><img src="handbook/12_insert_point.png" alt="Insert a point (Ctrl+click): Points are where you can grab a line. Ctrl+click on a line adds a point exactly there."></section>
<section class="slide" data-n="13"><img src="handbook/13_delete_point.png" alt="Delete points (point mode): Three ways to get rid of a point: dissolve it and keep the shape, remove it and smooth the line, or delete it together with its pieces."></section>
<section class="slide" data-n="14"><img src="handbook/14_symmetry.png" alt="Groups and generators: Symmetry: Generators work like in Cinema 4D: put objects under a Symmetry or Array null and Mule shows the copies live."></section>
<section class="slide" data-n="15"><img src="handbook/15_note_board.png" alt="Notes (N) and the note board: Notes are prompts in space: a short heading points at a part, and its board holds everything the AI should know about it. The octopus says which similar parts the same note also means."></section>
<section class="slide" data-n="16"><img src="handbook/16_hero_camera.png" alt="Hero camera: Hero cameras are the views that matter most. Tick a screenshot on a note board as hero camera, and the AI looks through exactly this camera while it builds and reviews."></section>
<section class="slide" data-n="17"><img src="handbook/17_brief_dialog.png" alt="Export Sketch Brief (Ctrl+E): The Sketch Brief is the hand-over to the AI: a folder with pictures, notes, the scene as USD and working rules. The dialog asks only for what the AI cannot read from the scene."></section>
<section class="slide" data-n="18"><img src="handbook/18_review_mark.png" alt="Review: talk your feedback: Walk through the scene and talk, like in a review session. Mule records your voice and where you looked and pointed; the AI turns it into draft notes."></section>
<section class="slide" data-n="19"><img src="handbook/19_shots.png" alt="Shots: what happens when: Shots shows timing without animating: drawings per frame on flipbook layers, camera positions and notes about what happens between them."></section>
</main>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  let i = 0;
  function show(k) {
    i = (k + slides.length) % slides.length;
    slides.forEach((s, j) => s.classList.toggle('on', j === i));
    document.getElementById('count').textContent = (i + 1) + ' / ' + slides.length;
    history.replaceState(null, '', '#' + (i + 1));
  }
  document.getElementById('prev').onclick = () => show(i - 1);
  document.getElementById('next').onclick = () => show(i + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
  show((parseInt(location.hash.slice(1)) || 1) - 1);
</script>
</body>
</html>
