# Noch nicht aktiv: nach .github/workflows/build.yml verschieben (der GitHub-Zugang braucht dafür das Recht „workflow“).
# Pakete je System bauen und mit dem Selbsttest prüfen. Nur von Hand starten (Actions -> Pakete bauen).
# Noch nie gelaufen: Linux und Mac sind ungeprüft; Mac braucht zusätzlich einen Core-Profile-Umbau (viewport.py).
name: Pakete bauen
on: workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System-Bibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python -m PyInstaller packaging/mule.spec --noconfirm
      - name: Selbsttest (Windows)
        if: runner.os == 'Windows'
        run: dist/Mule/Mule.exe --selftest selftest.json
      - name: Selbsttest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/Mule/Mule --selftest selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: Mule-${{ runner.os }}
          path: dist/
