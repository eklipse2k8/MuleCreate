# Not active yet: move to .github/workflows/build.yml (the GitHub credential needs the "workflow" scope for that).
# Build the packages per system and check them with the self-test. Start by hand only (Actions -> Build packages).
# Never run yet: Linux and Mac are untested; Mac additionally needs a core-profile rework (viewport.py).
name: Build packages
on: workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python -m PyInstaller packaging/mule.spec --noconfirm
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        run: dist/Mule/Mule.exe --selftest selftest.json
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/Mule/Mule --selftest selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: Mule-${{ runner.os }}
          path: dist/
