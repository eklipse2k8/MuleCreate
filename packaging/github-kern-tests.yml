# ENTWURF – noch nicht aktiv. Automatischer Lauf der Kern-Tests (Stufe 1, ohne Fenster) auf GitHub bei jedem Push,
# unter Windows und Linux.
#
# Einschalten (Artist):
#   1. Diese Datei nach .github/workflows/kern-tests.yml kopieren und committen.
#   2. Der Push braucht ein GitHub-Token mit dem Recht „workflow“ (das Token von Claude hat es nicht:
#      gh auth refresh -s workflow), oder die Datei im Browser auf GitHub anlegen.
#   Kosten: privates Repo = Actions-Minuten aus dem Freikontingent (Windows zählt doppelt); ein Lauf dauert rund
#   zwei Minuten, fast alles davon ist das Installieren der Pakete.
#
# Die Tests mit Fenster (Stufe 2) laufen hier bewusst nicht: Sie brauchen eine Grafikkarte bzw. einen
# Software-Renderer und sind dort noch nicht erprobt.
name: Kern-Tests
on:
  push:
    branches: [main, etappe-2]
  workflow_dispatch:
jobs:
  kern:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Bibliotheken für Qt ohne Bildschirm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements.txt
      - name: Kern-Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python tests/run.py --kern
